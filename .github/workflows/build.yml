name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe
        run: dotnet publish src/DeepSeekHarness -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-win-x64
          path: dist
